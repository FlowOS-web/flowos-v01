<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Gatebrook Password Recovery</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#0d0f13;--panel:#151820;--border:#2a303b;--text:#f5f7fa;--muted:#969eac}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:470px;width:100%;padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:18px}
    .brand{font-size:26px;font-weight:800;margin-bottom:24px}
    .brand span{color:#99a2b0}
    h1{font-size:26px;margin:0 0 12px}
    p{color:var(--muted);line-height:1.55}
    label{display:block;margin:18px 0 7px;color:#dce0e7;font-size:13px}
    input,button{font:inherit}
    input{width:100%;padding:12px 13px;margin-bottom:4px;background:#0f1218;color:white;border:1px solid #303643;border-radius:10px}
    input:focus{outline:2px solid #566275;outline-offset:1px}
    .btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:20px;font-weight:700;cursor:pointer;color:#111;background:#f3f4f6}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .feedback{font-size:14px;line-height:1.55;margin-top:16px;overflow-wrap:anywhere;color:#ffb6b6}
    .feedback.ok{color:#68d9a0}
    .hidden{display:none!important}
    .hint{font-size:12px}
    a{color:#a8c7ff}
    .foot{margin-top:24px;font-size:13px}
    .foot a + a{margin-left:10px}
  </style>
  <link rel="stylesheet" href="theme.css?v=1">
  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="brand-logo.css?v=1">
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="gatebrook-unified.css?v=1"></head>
<body class="gb-brand-activate-page">
  <main class="wrap">
    <section class="card">
      <div class="brand"><span class="gb-mark" aria-hidden="true"><svg class="gb-brand-glyph" viewBox="0 0 179 143" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true"><path class="gb-logo-frame" d="M1 0H178V77L161 64V17H19V124H90V142H1Z"/><path class="gb-logo-b" fill-rule="evenodd" d="M103 62H134L178 95V142H102Z M121 80L131 81L157 101L156 125L120 124Z"/><path class="gb-logo-g" d="M32 32V110L90 111V62H72L71 94L50 93V50L89 49L90 33Z"/><path class="gb-logo-cap" d="M103 32V49H126L129 52L147 51L146 32Z"/></svg></span><span class="gb-wordmark">GATEBROOK</span></div>
      <h1>Forgot your password?</h1>
      <p>Enter the email address you use to sign in. If an account exists for that address, we’ll send a secure password-reset link.</p>
      <form id="recoveryForm">
        <label for="email">Account email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button id="sendButton" class="btn" type="submit">Send reset link</button>
      </form>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      <p class="foot"><a href="dashboard.html">Back to business sign in</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://mxyikhxpzijrdrgowmxr.supabase.co",
      "sb_publishable_U-8BQS5nOCZtDLiss5CRxg_s9ioHW09",
      { auth: { detectSessionInUrl: false } }
    );
    const RESET_REDIRECT_URL = "https://gatebrook.work/reset-password.html";
    const form = document.getElementById("recoveryForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const feedbackElement = document.getElementById("feedback");

    function showFeedback(message, ok = false) {
      feedbackElement.textContent = message;
      feedbackElement.classList.toggle("ok", ok);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const email = emailInput.value.trim().toLowerCase();
      if (!email || !emailInput.checkValidity()) {
        emailInput.reportValidity();
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "Sending…";
      showFeedback("Requesting a reset link…", true);
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: RESET_REDIRECT_URL
        });
        if (error) throw error;
        showFeedback("If an account exists for that email, a password-reset link will be sent shortly. Check your inbox and spam folder.", true);
      } catch {
        showFeedback("We couldn’t start the password-reset request right now. Please try again later.");
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
