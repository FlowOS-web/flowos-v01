<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Choose a New Gatebrook Password</title>
  <script>
    // Capture recovery parameters in memory and scrub the URL before external assets load.
    window.gatebrookRecovery = (() => {
      const query = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.slice(1));
      const details = {
        accessToken: hash.get("access_token"),
        refreshToken: hash.get("refresh_token"),
        tokenType: hash.get("type"),
        tokenHash: query.get("token_hash") || hash.get("token_hash"),
        tokenHashType: query.get("type") || hash.get("type"),
        code: query.get("code"),
        error: query.get("error_description") || query.get("error") || hash.get("error_description") || hash.get("error")
      };
      history.replaceState(null, "", location.pathname);
      return details;
    })();
  </script>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#0d0f13;--panel:#151820;--border:#2a303b;--text:#f5f7fa;--muted:#969eac}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:470px;width:100%;padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:18px}
    .brand{font-size:26px;font-weight:800;margin-bottom:24px}
    .brand span{color:#99a2b0}
    h1{font-size:26px;margin:0 0 12px}
    p{color:var(--muted);line-height:1.55}
    label{display:block;margin:18px 0 7px;color:#dce0e7;font-size:13px}
    input,button{font:inherit}
    input{width:100%;padding:12px 13px;margin-bottom:4px;background:#0f1218;color:white;border:1px solid #303643;border-radius:10px}
    input:focus{outline:2px solid #566275;outline-offset:1px}
    .btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:20px;font-weight:700;cursor:pointer;color:#111;background:#f3f4f6}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .feedback{font-size:14px;line-height:1.55;margin-top:16px;overflow-wrap:anywhere;color:#ffb6b6}
    .feedback.ok{color:#68d9a0}
    .hidden{display:none!important}
    .hint{font-size:12px}
    a{color:#a8c7ff}
    .foot{margin-top:24px;font-size:13px}
    .foot a + a{margin-left:10px}
  </style>
  <link rel="stylesheet" href="theme.css?v=1">
  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="brand-logo.css?v=1">
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
</head>
<body class="gb-brand-activate-page">
  <main class="wrap">
    <section class="card">
      <div class="brand"><span class="gb-mark" aria-hidden="true"><svg class="gb-brand-glyph" viewBox="0 0 179 143" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true"><path class="gb-logo-frame" d="M1 0H178V77L161 64V17H19V124H90V142H1Z"/><path class="gb-logo-b" fill-rule="evenodd" d="M103 62H134L178 95V142H102Z M121 80L131 81L157 101L156 125L120 124Z"/><path class="gb-logo-g" d="M32 32V110L90 111V62H72L71 94L50 93V50L89 49L90 33Z"/><path class="gb-logo-cap" d="M103 32V49H126L129 52L147 51L146 32Z"/></svg></span><span class="gb-wordmark">GATEBROOK</span></div>
      <h1>Set a new password</h1>
      <p id="intro">Use the secure link in your password-reset email to choose a new password.</p>
      <form id="passwordForm" class="hidden">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="passwordHint">
        <p id="passwordHint" class="hint">Use 12–128 characters with uppercase and lowercase letters, a number, and a symbol.</p>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <button id="saveButton" class="btn" type="submit">Update password</button>
      </form>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      <p class="foot"><a href="forgot-password.html">Request a new reset link</a><a href="dashboard.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://mxyikhxpzijrdrgowmxr.supabase.co",
      "sb_publishable_U-8BQS5nOCZtDLiss5CRxg_s9ioHW09",
      { auth: { detectSessionInUrl: false } }
    );
    const recovery = window.gatebrookRecovery || {};
    delete window.gatebrookRecovery;
    const $ = id => document.getElementById(id);
    let authorizedUserId = null;

    function feedback(message, ok = false) {
      $("feedback").textContent = message;
      $("feedback").classList.toggle("ok", ok);
    }

    function clearPasswordFields() {
      $("newPassword").value = "";
      $("confirmPassword").value = "";
    }

    async function initialize() {
      const hasRecoveryParameters = Boolean(
        recovery.accessToken || recovery.refreshToken || recovery.tokenHash || recovery.code || recovery.error
      );
      try {
        if (recovery.error) throw new Error("Invalid recovery link.");

        if (recovery.code) {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(recovery.code);
          if (error || !data?.session) throw error || new Error("No recovery session was returned.");
        } else if (recovery.accessToken || recovery.refreshToken) {
          if (recovery.tokenType !== "recovery" || !recovery.accessToken || !recovery.refreshToken) {
            throw new Error("Invalid recovery token.");
          }
          const { data, error } = await supabaseClient.auth.setSession({
            access_token: recovery.accessToken,
            refresh_token: recovery.refreshToken
          });
          if (error || !data?.session) throw error || new Error("No recovery session was returned.");
        } else if (recovery.tokenHash) {
          if (recovery.tokenHashType !== "recovery") throw new Error("Invalid recovery token.");
          const { data, error } = await supabaseClient.auth.verifyOtp({
            token_hash: recovery.tokenHash,
            type: "recovery"
          });
          if (error || !data?.session) throw error || new Error("No recovery session was returned.");
        }

        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        if (!session) {
          feedback(hasRecoveryParameters
            ? "This password-reset link is invalid or has expired. Request a new link and open the latest email."
            : "Open the secure link from your password-reset email, or request a new reset link below.");
          return;
        }

        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError || !user) throw userError || new Error("No authenticated user was returned.");
        authorizedUserId = user.id;
        $("intro").textContent = "Choose a new password for your Gatebrook account.";
        $("passwordForm").classList.remove("hidden");
        $("newPassword").focus();
        feedback("", true);
      } catch {
        authorizedUserId = null;
        $("passwordForm").classList.add("hidden");
        feedback("This password-reset link is invalid or has expired. Request a new reset link and open the latest email.");
      } finally {
        recovery.accessToken = null;
        recovery.refreshToken = null;
        recovery.tokenHash = null;
        recovery.code = null;
        recovery.error = null;
      }
    }

    $("passwordForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (!authorizedUserId) {
        feedback("Your recovery session is no longer valid. Request a new reset link.");
        $("passwordForm").classList.add("hidden");
        return;
      }

      const password = $("newPassword").value;
      if (password !== $("confirmPassword").value) {
        feedback("The passwords do not match.");
        return;
      }
      if (password.length < 12 || password.length > 128 || !/[a-z]/.test(password) ||
          !/[A-Z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9\s]/.test(password)) {
        feedback("Use 12–128 characters with uppercase and lowercase letters, a number, and a symbol.");
        return;
      }

      $("saveButton").disabled = true;
      $("saveButton").textContent = "Updating…";
      feedback("Updating your password…", true);
      try {
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError || user?.id !== authorizedUserId) throw new Error("The recovery session is no longer valid.");
        const { data, error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        if (data.user?.id !== authorizedUserId) throw new Error("The account could not be confirmed.");
        clearPasswordFields();
        authorizedUserId = null;
        feedback("Your password has been updated. Opening your dashboard…", true);
        location.replace("dashboard.html");
      } catch {
        feedback("Your password could not be updated. Check the password requirements and try again, or request a fresh reset link.");
      } finally {
        $("saveButton").disabled = false;
        $("saveButton").textContent = "Update password";
      }
    });

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (authorizedUserId && (event === "SIGNED_OUT" || (session?.user?.id && session.user.id !== authorizedUserId))) {
        authorizedUserId = null;
        $("passwordForm").classList.add("hidden");
        clearPasswordFields();
        feedback("Your recovery session has ended. Request a new password-reset link to continue.");
      }
    });

    window.addEventListener("pagehide", () => {
      recovery.accessToken = null;
      recovery.refreshToken = null;
      recovery.tokenHash = null;
      recovery.code = null;
      authorizedUserId = null;
      clearPasswordFields();
    });

    initialize();
  </script>
</body>
</html>
