<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>FlowOS Service Request</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0d0f13;
      --panel: #171a21;
      --border: #2a303b;
      --text: #f5f7fa;
      --muted: #9ca4b1;
      --input: #101318;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 32px 18px 60px;
    }

    .flowos {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .flowos strong {
      color: white;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 35px;
    }

    .industry {
      color: #7f8897;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e1e5eb;
      font-size: 13px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;

      background: var(--input);
      color: white;

      border: 1px solid #303643;
      border-radius: 10px;

      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #576273;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;

      border: 0;
      border-radius: 10px;

      background: #f2f3f5;
      color: #111;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 18px;
      padding: 14px;

      border-radius: 10px;

      line-height: 1.5;
    }

    .success {
      background: #12251b;
      border: 1px solid #28563b;
      color: #d8ffe6;
    }

    .error {
      background: #2d1616;
      border: 1px solid #663434;
      color: #ffdddd;
    }

    .error-details {
      margin-top: 7px;
      font-size: 12px;
      opacity: .8;
    }

    .loading {
      color: var(--muted);
      padding: 30px 0;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      margin-top: 14px;

      color: #747d8c;
      font-size: 11px;
    }

    @media (max-width: 620px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      h1 {
        font-size: 29px;
      }

    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="flowos">
    Powered by <strong>FlowOS</strong>
  </div>


  <div
    id="loading"
    class="loading"
  >
    Loading business...
  </div>


  <div
    id="businessContent"
    class="hidden"
  >

    <div
      id="industry"
      class="industry"
    ></div>

    <h1 id="businessName">
      Service Request
    </h1>

    <div
      id="tagline"
      class="tagline"
    ></div>


    <div class="card">

      <form id="leadForm">

        <div class="grid">


          <div>

            <label for="customer_name">
              Name *
            </label>

            <input
              id="customer_name"
              type="text"
              required
              autocomplete="name"
              placeholder="John Smith"
            >

          </div>


          <div>

            <label for="phone">
              Phone
            </label>

            <input
              id="phone"
              type="tel"
              autocomplete="tel"
              placeholder="7635551234"
            >

          </div>


          <div>

            <label for="email">
              Email
            </label>

            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="john@example.com"
            >

          </div>


          <div>

            <label for="service">
              Service *
            </label>

            <select
              id="service"
              required
            >

              <option value="">
                Loading services...
              </option>

            </select>

          </div>


          <div>

            <label for="preferred_date">
              Preferred Date
            </label>

            <input
              id="preferred_date"
              type="date"
            >

          </div>


          <div>

            <label for="service_location">
              Service Address / Location
            </label>

            <input
              id="service_location"
              type="text"
              placeholder="Address or service location"
            >

          </div>


          <div class="full">

            <label for="notes">
              Tell us what you need
            </label>

            <textarea
              id="notes"
              placeholder="Describe the job, problem, project, or anything the business should know."
            ></textarea>

          </div>


        </div>


        <button
          id="submitButton"
          type="submit"
        >
          Submit Request
        </button>

      </form>


      <div
        id="successMessage"
        class="message success"
      >
        Your request has been received. The business will follow up with you.
      </div>


      <div
        id="errorMessage"
        class="message error"
      >

        <strong>
          Something went wrong.
        </strong>

        <div
          id="errorDetails"
          class="error-details"
        ></div>

      </div>


      <div class="footer">
        Secure request powered by FlowOS.
      </div>

    </div>

  </div>


  <div
    id="businessError"
    class="message error"
  >

    <strong>
      Business unavailable.
    </strong>

    <div
      id="businessErrorDetails"
      class="error-details"
    ></div>

  </div>

</div>


<script>

  /*
  ============================================
  SUPABASE CONFIG
  ============================================

  Use the exact same base URL and publishable
  key you have already been using.

  Do NOT use service_role or secret keys.
  */

  const SUPABASE_URL =
    "https://mxyikhxpzijrdrgowmxr.supabase.co/rest/v1/";

  const SUPABASE_KEY =
    "sb_publishable_U-8BQS5nOCZtDLiss5CRxg_s9ioHW09";


  /*
  ============================================
  BUSINESS STATE
  ============================================
  */

  let BUSINESS_ID = null;

  let BUSINESS_SLUG = null;


  /*
  ============================================
  ELEMENTS
  ============================================
  */

  const loading =
    document.getElementById("loading");

  const businessContent =
    document.getElementById(
      "businessContent"
    );

  const businessError =
    document.getElementById(
      "businessError"
    );

  const businessErrorDetails =
    document.getElementById(
      "businessErrorDetails"
    );

  const businessName =
    document.getElementById(
      "businessName"
    );

  const industry =
    document.getElementById(
      "industry"
    );

  const tagline =
    document.getElementById(
      "tagline"
    );

  const serviceSelect =
    document.getElementById(
      "service"
    );

  const leadForm =
    document.getElementById(
      "leadForm"
    );

  const submitButton =
    document.getElementById(
      "submitButton"
    );

  const successMessage =
    document.getElementById(
      "successMessage"
    );

  const errorMessage =
    document.getElementById(
      "errorMessage"
    );

  const errorDetails =
    document.getElementById(
      "errorDetails"
    );


  /*
  ============================================
  MINIMUM DATE
  ============================================
  */

  const dateInput =
    document.getElementById(
      "preferred_date"
    );

  dateInput.min =
    new Date()
      .toISOString()
      .split("T")[0];


  /*
  ============================================
  GET BUSINESS SLUG FROM URL
  ============================================

  Example:

  index.html?b=flowos-demo
  */

  function getBusinessSlug() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return (
      params.get("b") ||
      "flowos-demo"
    );

  }


  /*
  ============================================
  LOAD BUSINESS PROFILE
  ============================================
  */

  async function loadBusiness() {

    try {

      BUSINESS_SLUG =
        getBusinessSlug();


      const profileUrl =
        `${SUPABASE_URL}/rest/v1/business_public_profiles` +
        `?slug=eq.${encodeURIComponent(BUSINESS_SLUG)}` +
        `&active=eq.true` +
        `&select=business_id,slug,display_name,industry,tagline` +
        `&limit=1`;


      const profileResponse =
        await fetch(
          profileUrl,
          {
            headers: {
              "apikey":
                SUPABASE_KEY
            }
          }
        );


      if (!profileResponse.ok) {

        throw new Error(
          await profileResponse.text()
        );

      }


      const profiles =
        await profileResponse.json();


      if (
        !profiles ||
        profiles.length === 0
      ) {

        throw new Error(
          "No active business was found for this link."
        );

      }


      const profile =
        profiles[0];


      BUSINESS_ID =
        profile.business_id;


      businessName.textContent =
        profile.display_name;


      document.title =
        `${profile.display_name} | Service Request`;


      industry.textContent =
        profile.industry || "";


      tagline.textContent =
        profile.tagline ||
        "Submit your request and we will get back to you.";


      await loadServices();


      loading.classList.add(
        "hidden"
      );

      businessContent.classList.remove(
        "hidden"
      );

    }

    catch(error) {

      console.error(
        "Business loading error:",
        error
      );


      loading.classList.add(
        "hidden"
      );


      businessError.style.display =
        "block";


      businessErrorDetails.textContent =
        error.message;

    }

  }


  /*
  ============================================
  LOAD SERVICES
  ============================================
  */

  async function loadServices() {

    const servicesUrl =
      `${SUPABASE_URL}/rest/v1/business_services` +
      `?business_id=eq.${encodeURIComponent(BUSINESS_ID)}` +
      `&active=eq.true` +
      `&select=id,name,sort_order` +
      `&order=sort_order.asc`;


    const response =
      await fetch(
        servicesUrl,
        {
          headers: {
            "apikey":
              SUPABASE_KEY
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const services =
      await response.json();


    serviceSelect.innerHTML =
      `<option value="">Select a service</option>`;


    for (
      const service
      of services
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        service.name;


      option.textContent =
        service.name;


      serviceSelect.appendChild(
        option
      );

    }


    if (
      services.length === 0
    ) {

      serviceSelect.innerHTML =
        `<option value="General Inquiry">General Inquiry</option>`;

    }

  }


  /*
  ============================================
  SUBMIT LEAD
  ============================================
  */

  leadForm.addEventListener(
    "submit",

    async function(event) {

      event.preventDefault();


      successMessage.style.display =
        "none";

      errorMessage.style.display =
        "none";

      errorDetails.textContent =
        "";


      const customerName =
        document
          .getElementById(
            "customer_name"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const service =
        document
          .getElementById(
            "service"
          )
          .value;


      const preferredDate =
        document
          .getElementById(
            "preferred_date"
          )
          .value;


      const serviceLocation =
        document
          .getElementById(
            "service_location"
          )
          .value
          .trim();


      const notes =
        document
          .getElementById(
            "notes"
          )
          .value
          .trim();


      /*
      Require at least one contact method.
      */

      if (
        !phone &&
        !email
      ) {

        errorMessage.style.display =
          "block";

        errorDetails.textContent =
          "Please enter either a phone number or email address.";

        return;

      }


      if (!BUSINESS_ID) {

        errorMessage.style.display =
          "block";

        errorDetails.textContent =
          "Business information has not loaded.";

        return;

      }


      submitButton.disabled =
        true;

      submitButton.textContent =
        "Submitting...";


      const lead = {

        business_id:
          BUSINESS_ID,

        customer_name:
          customerName,

        phone:
          phone || null,

        email:
          email || null,

        vehicle:
          null,

        vehicle_type:
          null,

        service:
          service,

        service_location:
          serviceLocation || null,

        preferred_date:
          preferredDate || null,

        notes:
          notes || null,

        status:
          "new",

        source:
          "website"

      };


      try {

        /*
        ========================================
        SAVE LEAD
        ========================================
        */

        const response =
          await fetch(

            `${SUPABASE_URL}/rest/v1/leads`,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Prefer":
                  "return=minimal"

              },

              body:
                JSON.stringify(
                  lead
                )

            }

          );


        if (!response.ok) {

          const responseText =
            await response.text();


          throw new Error(
            `Database error ${response.status}: ${responseText}`
          );

        }


        /*
        ========================================
        OWNER NOTIFICATION
        ========================================

        Notification failures do not cause
        the customer submission itself to fail.
        */

        try {

          const notificationResponse =
            await fetch(

              `${SUPABASE_URL}/functions/v1/notify-new-lead`,

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_KEY

                },

                body:
                  JSON.stringify(
                    lead
                  )

              }

            );


          if (
            !notificationResponse.ok
          ) {

            console.error(
              "Owner notification failed:",
              await notificationResponse.text()
            );

          }

        }

        catch(notificationError) {

          console.error(
            "Notification error:",
            notificationError
          );

        }


        /*
        ========================================
        SUCCESS
        ========================================
        */

        leadForm.reset();


        successMessage.style.display =
          "block";


        successMessage.scrollIntoView({
          behavior:
            "smooth",
          block:
            "center"
        });

      }

      catch(error) {

        console.error(
          "Lead submission error:",
          error
        );


        errorMessage.style.display =
          "block";


        errorDetails.textContent =
          error.message;

      }

      finally {

        submitButton.disabled =
          false;


        submitButton.textContent =
          "Submit Request";

      }

    }

  );


  /*
  ============================================
  START
  ============================================
  */

  loadBusiness();

</script>

</body>
</html>
